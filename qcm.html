<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>EFREI Révision QCM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Mise en page : en-tête fin + colonne centrale (max 1040px) ; accueil en grille de cartes, jeu en une carte centrée.
   Reprend le design system « EFREI Révision » : bleu EFREI, bleu nuit, encadrés à rôle, police cursive. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --ink:#141b30; --muted:#5a6275;
  --blue:#377fbc; --blue-ink:#2a6aa3; --tint:#eaf2fa; --line:#c9dcee;
  --amber:#e39a2d; --amber-tint:#fdf0dc; --amber-ink:#8a4b00;
  --good:#1d7a4c; --good-tint:#e2f3e9; --bad:#b3261e; --bad-tint:#fbe8e6;
  --on-blue:#ffffff; --navy:#141b30; --on-navy:#ffffff;
  --font:cursive; --mono:ui-monospace,Menlo,Consolas,monospace;
  --r-sm:3px; --r-md:6px; --r-lg:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1222; --surface:#161d33; --ink:#e8edf6; --muted:#a3adc2;
  --blue:#5b9bd5; --blue-ink:#8bbbe6; --tint:#1b2a44; --line:#2c3c5a;
  --amber:#f0ae4a; --amber-tint:#3a2a12; --amber-ink:#f5c27a;
  --good:#5ccb94; --good-tint:#12301f; --bad:#f2857d; --bad-tint:#3a1816;
  --on-blue:#0d1222; --navy:#e8edf6; --on-navy:#0d1222; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1222; --surface:#161d33; --ink:#e8edf6; --muted:#a3adc2;
  --blue:#5b9bd5; --blue-ink:#8bbbe6; --tint:#1b2a44; --line:#2c3c5a;
  --amber:#f0ae4a; --amber-tint:#3a2a12; --amber-ink:#f5c27a;
  --good:#5ccb94; --good-tint:#12301f; --bad:#f2857d; --bad-tint:#3a1816;
  --on-blue:#0d1222; --navy:#e8edf6; --on-navy:#0d1222; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:2px solid var(--blue);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top__in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:10px}
.logo{height:34px;width:auto;display:block;background:#fff;border-radius:var(--r-md);padding:3px 6px}
.top__meta{flex:1;min-width:0;display:flex;flex-direction:column}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-ink)}
.top__title{font-size:18px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;background:var(--surface);white-space:nowrap}
.chip .flame{color:var(--amber)}
.who{display:flex;gap:8px;align-items:center}
.modbtn{color:var(--blue-ink)}
.modbtn:hover{border-color:var(--blue)}
.mode.is-cur{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.mode:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
.filepick{display:inline-flex;margin-top:12px;cursor:pointer}

.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px}

/* Accueil */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:stretch;margin-bottom:26px}
.hero__txt{display:flex;flex-direction:column;gap:10px;justify-content:center}
.hero h1{font-size:clamp(30px,5vw,46px);line-height:1.05;color:var(--blue)}
.hero p{color:var(--muted);max-width:52ch}
.profile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.lvl{display:flex;align-items:center;gap:12px}
.lvl__badge{width:52px;height:52px;border-radius:50%;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;font-size:22px;font-weight:700;flex:none}
.lvl__name{font-weight:700;font-size:18px}
.lvl__sub{font-size:13px;color:var(--muted)}
.bar{height:10px;border-radius:999px;background:var(--tint);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .5s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--tint);border-radius:var(--r-md);padding:8px 10px}
.stat b{display:block;font-size:20px;line-height:1.1}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.sec{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.sec__num{font-size:20px;font-weight:700;color:var(--blue)}
.sec__title{flex:1;font-size:20px;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:3px}

.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mode{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s,box-shadow .15s}
.mode:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 6px 18px -10px var(--blue)}
.mode__icon{width:44px;height:44px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--tint);color:var(--blue)}
.mode__icon svg{width:26px;height:26px}
.mode h3{font-size:20px}
.mode p{font-size:14px;color:var(--muted)}
.mode__foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px dashed var(--line);font-size:13px}
.mode__go{font-weight:700;color:var(--blue-ink)}
.mode--hot .mode__icon{background:var(--amber-tint);color:var(--amber-ink)}
.mode--hot{border-color:var(--amber)}

.themes{display:flex;flex-wrap:wrap;gap:8px}
.tog{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.tog[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.tog small{opacity:.8}
.hint{font-size:13px;color:var(--muted);margin-top:8px}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cols>*{min-width:0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:var(--r-md);padding:10px;background:var(--surface);display:flex;gap:10px;align-items:flex-start}
.badge__ico{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--muted);font-weight:700}
.badge.on .badge__ico{background:var(--blue);color:var(--on-blue)}
.badge b{display:block;font-size:14px}
.badge span{font-size:12px;color:var(--muted)}
.badge:not(.on){opacity:.6}

.board{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:10px 6px;font-size:14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--blue-ink);border-bottom-color:var(--blue)}
.rows{list-style:none;margin:0;padding:6px 0}
.rows li{display:flex;align-items:center;gap:10px;padding:7px 14px}
.rows li.me{background:var(--tint)}
.rank{width:26px;text-align:center;font-weight:700;color:var(--muted)}
.rank.p1{color:var(--amber-ink)}
.rows img{width:26px;height:26px;border-radius:50%}
.rows .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows .sc{font-weight:700}
.rows li.empty{display:block;padding:16px;color:var(--muted);font-size:14px}

/* Jeu */
.game{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.quit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:6px 12px;font-size:14px}
.hud__mid{flex:1;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:15px}
.pill--streak{border-color:var(--amber);background:var(--amber-tint);color:var(--amber-ink);transition:transform .2s}
.pill--streak.bump{transform:scale(1.18)}
.pill--streak.cold{border-color:var(--line);background:var(--surface);color:var(--muted)}
.hearts{color:var(--bad);letter-spacing:2px}
.timer{height:8px;border-radius:999px;background:var(--tint);overflow:hidden}
.timer>i{display:block;height:100%;background:var(--blue);width:100%}
.timer.low>i{background:var(--amber)}
.progress{display:flex;gap:3px}
.progress i{flex:1;height:5px;border-radius:2px;background:var(--line)}
.progress i.ok{background:var(--good)} .progress i.ko{background:var(--bad)} .progress i.cur{background:var(--blue)}

.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.q__head{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}
.q__text{font-size:clamp(19px,2.6vw,23px);line-height:1.35;font-weight:700}
.q__text code{font-family:var(--mono);font-size:.85em;background:var(--tint);padding:0 4px;border-radius:var(--r-sm)}
.choices{display:grid;gap:10px;margin-top:16px}
.ch{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px 14px;font-size:17px;transition:border-color .12s,background .12s,transform .12s}
.ch:hover:not(:disabled){border-color:var(--blue);background:var(--tint)}
.ch:active:not(:disabled){transform:scale(.99)}
.ch__k{flex:none;width:28px;height:28px;border-radius:var(--r-sm);display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--tint);color:var(--blue-ink)}
.ch__t{flex:1;min-width:0}
.ch__m{flex:none;font-weight:700}
.ch:disabled{cursor:default}
.ch.ok{border-color:var(--good);background:var(--good-tint)}
.ch.ok .ch__k{background:var(--good);color:var(--surface)}
.ch.ko{border-color:var(--bad);background:var(--bad-tint)}
.ch.ko .ch__k{background:var(--bad);color:var(--surface)}
.ch.gone{opacity:.35;text-decoration:line-through}
.ch.dim{opacity:.55}
.tools{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.joker{background:var(--surface);border:1.5px dashed var(--amber);color:var(--amber-ink);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.joker:disabled{opacity:.4;cursor:default}

.fb{display:flex;flex-direction:column;gap:10px}
.verdict{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:20px;font-weight:700}
.verdict.ok{color:var(--good)} .verdict.ko{color:var(--bad)}
.verdict small{font-size:14px;color:var(--muted);font-weight:400}
.box{border-radius:var(--r-md);padding:10px 14px;border:1px solid var(--line)}
.box__l{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-ink);margin-bottom:4px}
.box--def{background:var(--tint)}
.box--trap{background:var(--amber-tint);border-color:var(--amber)}
.box--trap .box__l{color:var(--amber-ink)}
.box--trap .box__l::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-right:6px}
.next{align-self:flex-end;background:var(--blue);color:var(--on-blue);border:0;border-radius:var(--r-md);padding:10px 18px;font-size:17px;font-weight:700}
.next kbd{font-family:var(--font);font-size:12px;opacity:.85;margin-left:6px}

.pop{position:absolute;right:18px;top:-14px;background:var(--blue);color:var(--on-blue);font-weight:700;border-radius:999px;padding:4px 12px;font-size:16px;pointer-events:none;animation:pop 1s ease-out forwards}
@keyframes pop{0%{transform:translateY(8px) scale(.8);opacity:0}20%{transform:translateY(0) scale(1.1);opacity:1}100%{transform:translateY(-26px) scale(1);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--on-navy);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20;animation:toast 2.2s ease forwards;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

/* Fin de partie */
.end{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.end__score{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.end__score .big{font-size:clamp(48px,10vw,72px);font-weight:700;color:var(--blue);line-height:1}
.record{display:inline-block;background:var(--amber-tint);color:var(--amber-ink);border:1px solid var(--amber);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}
.end .stats{grid-template-columns:repeat(4,1fr)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:10px 16px;font-size:16px;font-weight:700}
.btn--main{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.review{display:flex;flex-direction:column;gap:10px}
.review details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px}
.review summary{cursor:pointer;font-weight:700}
.review .ans{margin:8px 0;font-size:14px}
.review .ans b{color:var(--good)}
.newbadges{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}

.foot{margin-top:30px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .modes{grid-template-columns:1fr}
  .cols{grid-template-columns:1fr}
  .end .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:520px){
  .top__title{font-size:16px}
  .top .eyebrow{display:none}
  .hud{gap:6px}
  .pill{padding:4px 10px;font-size:14px}
  .logo{height:28px}
  .who .chip.lvlchip{display:none}
  .card{padding:16px}
  .ch{font-size:16px;padding:11px 12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
"use strict";
/* ---------- Données : un fichier JSON par module dans modules/ ----------
   La liste vient de l'index du dossier quand le serveur en fournit un (python -m http.server, Live Server…),
   sinon de modules/index.json, un simple tableau de noms de fichiers. */
const MOD_DIR='modules/', MOD_LS='efrei-qcm-module';
let MODS=null, MOD=null, MOD_KEY='';
let BANK={titre:'',matiere:'',questions:[]}, QS=[], THEMES=[];
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
function parseQuestions(bank){
  return (bank.questions||[]).filter(q=>q && q.question && Array.isArray(q.choix) && q.choix.length>=2).map((q,i)=>{
    let ans = typeof q.reponse==='number' ? q.reponse : q.choix.indexOf(q.reponse);
    if(ans<0||ans>=q.choix.length) ans=0;
    return {id: q.id || ('q'+i+'-'+hash(q.question)), theme:q.theme||'Général', q:q.question, choix:q.choix, ans, expl:q.explication||'', trap:q.piege||'', lvl:Math.min(3,Math.max(1,q.niveau||1))};
  });
}
async function listModules(){
  let files=[];
  try{
    const r=await fetch(MOD_DIR,{cache:'no-store'});
    if(r.ok && /html/i.test(r.headers.get('content-type')||'')){
      const doc=new DOMParser().parseFromString(await r.text(),'text/html');
      files=[...doc.querySelectorAll('a[href]')].map(a=>{ try{ return decodeURIComponent(a.getAttribute('href').split(/[?#]/)[0].split('/').pop()); }catch(e){ return ''; } }).filter(f=>/\.json$/i.test(f));
    }
  }catch(e){}
  if(!files.length) files=await githubListing();
  if(!files.length){
    try{ const r=await fetch(MOD_DIR+'index.json',{cache:'no-store'}); if(r.ok){ const j=await r.json(); if(Array.isArray(j)) files=j; } }catch(e){}
  }
  files=[...new Set(files)].filter(f=>typeof f==='string' && /\.json$/i.test(f) && f.toLowerCase()!=='index.json').sort((a,b)=>a.localeCompare(b,'fr'));
  return Promise.all(files.map(async file=>{
    try{
      const r=await fetch(MOD_DIR+encodeURIComponent(file),{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const bank=await r.json(), qs=parseQuestions(bank);
      if(!qs.length) throw new Error('aucune question valide');
      return {file, bank, n:qs.length, themes:new Set(qs.map(q=>q.theme)).size};
    }catch(e){ return {file, error:e.message||String(e)}; }
  }));
}
/* GitHub Pages n'affiche pas le contenu des dossiers : on demande la liste à l'API GitHub
   (<compte>.github.io/<dépôt>/… → dépôt <compte>/<dépôt>, branche par défaut). */
async function githubListing(){
  const m=location.hostname.match(/^([\w-]+)\.github\.io$/i); if(!m) return [];
  const parts=location.pathname.split('/').filter(Boolean).map(decodeURIComponent);
  if(parts.length && /\.[a-z0-9]+$/i.test(parts[parts.length-1])) parts.pop();
  const tries = parts.length ? [[parts[0], parts.slice(1)], [m[1]+'.github.io', parts]] : [[m[1]+'.github.io', []]];
  for(const [repo, dir] of tries){
    try{
      const r=await fetch('https://api.github.com/repos/'+m[1]+'/'+encodeURIComponent(repo)+'/contents/'+[...dir,'modules'].map(encodeURIComponent).join('/'));
      if(!r.ok) continue;
      const j=await r.json();
      if(Array.isArray(j)) return j.filter(x=>x.type==='file').map(x=>x.name);
    }catch(e){}
  }
  return [];
}

/* ---------- Sélection pondérée : les questions ratées reviennent plus souvent ---------- */
let activeThemes = new Set();
function pool(onlyIds){
  let p = onlyIds ? QS.filter(q=>onlyIds.includes(q.id)) : QS.filter(q=>activeThemes.has(q.theme));
  return p.length ? p : QS.slice();
}
function weight(q){ const s=P.seen[q.id]; if(!s) return 1.6; return Math.max(0.35, 1 + 1.5*s.ko - 0.4*s.ok); }
function weightedDeck(p){
  // tirage pondéré sans remise (clé aléatoire de type Efraimidis-Spirakis)
  return p.map(q=>({q, k:Math.pow(Math.random(), 1/weight(q))})).sort((a,b)=>b.k-a.k).map(x=>x.q);
}

/* ---------- Partie ---------- */
let view='modules', G=null, timerRaf=0;
function newGame(mode, onlyIds){
  const deck = weightedDeck(pool(onlyIds));
  G = {mode, cfg:MODES[mode], deck, di:0, idx:0, score:0, streak:0, bestStreak:0, correct:0, answered:0,
       lives:MODES[mode].lives||0, timeLeft:MODES[mode].total||0, joker:true, log:[], cur:null, locked:false,
       qStart:0, qPaused:0, times:[], newBadges:[], onlyIds:onlyIds||null, flash:false};
  if(mode==='classique') G.total = Math.min(MODES.classique.n, deck.length);
  view='game'; nextQuestion();
}
function drawQ(){
  if(G.di>=G.deck.length){ G.deck = weightedDeck(pool(G.onlyIds)); G.di=0; if(G.deck.length>1 && G.cur && G.deck[0].id===G.cur.src.id) G.deck.push(G.deck.shift()); }
  const src = G.deck[G.di++];
  const order = shuffle(src.choix.map((_,i)=>i));
  return {src, order, ans: order.indexOf(src.ans), removed:[]};
}
function nextQuestion(){
  if(isOver()) return endGame();
  G.cur = drawQ(); G.locked=false; G.idx++;
  G.qStart = performance.now();
  renderGame();
  startTimer();
}
function isOver(){
  if(G.mode==='classique') return G.answered>=G.total;
  if(G.mode==='survie') return G.lives<=0;
  if(G.mode==='chrono') return G.timeLeft<=0;
}
function mult(){ return 1 + 0.5*Math.min(4, Math.floor(G.streak/3)); }

function startTimer(){
  cancelAnimationFrame(timerRaf);
  const bar = $('.timer>i'), wrap=$('.timer');
  if(G.mode==='chrono'){
    let last=performance.now();
    const tick=(t)=>{ if(view!=='game'||G.locked) return; G.timeLeft -= (t-last)/1000; last=t;
      if(G.timeLeft<=0){ G.timeLeft=0; updateHud(); return answer(-1); }
      updateHud(); timerRaf=requestAnimationFrame(tick); };
    timerRaf=requestAnimationFrame(tick); return;
  }
  const lim=G.cfg.qTime*1000;
  const tick=(t)=>{ if(view!=='game'||G.locked) return; const el=t-G.qStart, f=Math.max(0,1-el/lim);
    if(bar) bar.style.width=(f*100)+'%'; if(wrap) wrap.classList.toggle('low', f<0.3);
    const s=$('#qsec'); if(s) s.textContent=Math.ceil(f*G.cfg.qTime)+' s';
    if(f<=0) return answer(-1);
    timerRaf=requestAnimationFrame(tick); };
  timerRaf=requestAnimationFrame(tick);
}

function answer(choicePos){
  if(G.locked) return; G.locked=true; cancelAnimationFrame(timerRaf);
  const c=G.cur, ok = choicePos===c.ans, secs=(performance.now()-G.qStart)/1000;
  G.answered++; G.times.push(secs);
  const s = P.seen[c.src.id] || (P.seen[c.src.id]={ok:0,ko:0});
  let gained=0;
  if(ok){
    G.correct++; G.streak++; G.bestStreak=Math.max(G.bestStreak,G.streak); s.ok++;
    const base = 80 + 20*c.src.lvl;
    let speed;
    if(G.mode==='chrono'){ speed = Math.round(50*Math.max(0,1-secs/8)); G.timeLeft += 3; }
    else speed = Math.round(50*Math.max(0, 1 - secs/G.cfg.qTime));
    gained = Math.round((base+speed)*mult());
    G.score += gained;
    if(secs<3) G.flash=true;
    if(G.streak===3||G.streak===6||G.streak===9||G.streak===12) toast('Série de '+G.streak+' ! Multiplicateur ×'+mult());
    else if(G.streak===5) toast('Série de 5. Tu es en feu.');
    else if(G.streak===10) toast('Série de 10. Inarrêtable.');
    P.mistakes = P.mistakes.filter(id=>id!==c.src.id);
  } else {
    if(G.streak>=3) toast('Série de '+G.streak+' perdue');
    G.streak=0; s.ko++;
    if(G.mode==='survie') G.lives--;
    if(G.mode==='chrono') G.timeLeft = Math.max(0, G.timeLeft-5);
    if(!P.mistakes.includes(c.src.id)) P.mistakes.push(c.src.id);
  }
  G.log.push({src:c.src, ok, picked: choicePos>=0 ? c.order[choicePos] : -1, gained, secs});
  saveLocal();
  renderFeedback(choicePos, ok, gained, secs);
}

function useJoker(){
  if(!G.joker||G.locked) return; G.joker=false;
  const c=G.cur; const wrong=shuffle(c.order.map((_,i)=>i).filter(i=>i!==c.ans));
  c.removed = wrong.slice(0, Math.max(0, Math.min(2, c.order.length-2)));
  c.removed.forEach(i=>{ const b=document.querySelector('.ch[data-i="'+i+'"]'); if(b){ b.classList.add('gone'); b.disabled=true; } });
  const j=$('#joker'); if(j) j.disabled=true;
}

function endGame(){
  cancelAnimationFrame(timerRaf);
  const xpGain = Math.round(G.score/10) + 5*G.correct;
  const before = lvlOf(P.xp);
  const prevBest = P.best[G.mode]||0;
  const record = G.score>prevBest && G.score>0;
  if(record) P.best[G.mode]=G.score;
  P.xp += xpGain; P.games++;
  // série de jours
  const t=today(), y=today(new Date(Date.now()-864e5));
  if(P.lastDay!==t){ P.days = P.lastDay===y ? P.days+1 : 1; P.lastDay=t; }
  // badges
  const has=id=>P.badges.includes(id), give=id=>{ if(!has(id)){ P.badges.push(id); G.newBadges.push(id);} };
  give('first');
  if(G.bestStreak>=5) give('fire5');
  if(G.bestStreak>=10) give('fire10');
  if(G.mode==='classique' && G.total>0 && G.correct===G.total) give('perfect');
  if(G.flash) give('flash');
  if(G.mode==='survie' && G.correct>=20) give('survivor');
  if(G.mode==='chrono' && G.correct>=15) give('chrono');
  if(P.days>=3) give('days3');
  if(QS.length && QS.every(q=>P.seen[q.id] && P.seen[q.id].ok>0)) give('all');
  if(lvlOf(P.xp)>=5) give('lvl5');
  G.result = {xpGain, record, prevBest, levelUp: lvlOf(P.xp)>before};
  save();
  view='end'; renderEnd();
  if(record || G.result.levelUp) confetti();
}

          ${['classique','survie','chrono','xp'].map(m=>`<button role="tab" data-board="${m}" aria-selected="${boardMode===m}">${m==='xp'?'XP':MODES[m].name.replace('Contre-la-montre','Chrono')}</button>`).join('')}
        </div>
        <ol class="rows" id="rows"></ol>
      </div>
    </div>
  </div>
  <footer class="foot"><span>EFREI Paris · ${esc(BANK.matiere||'')}</span><span>Raccourcis en jeu : touches 1–4 ou A–D, puis Entrée</span></footer>`;

  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
    const m=b.dataset.mode;
    if(m==='erreurs') newGame('classique', mistakes); else newGame(m);
  });
  app.querySelectorAll('[data-theme-name]').forEach(b=>b.onclick=()=>{
    const t=b.dataset.themeName;
    if(activeThemes.has(t)){ if(activeThemes.size>1) activeThemes.delete(t); } else activeThemes.add(t);
    try{ localStorage.setItem(LS_KEY+'-themes', JSON.stringify([...activeThemes])); }catch(e){}
    renderHome();
  });
  app.querySelectorAll('[data-board]').forEach(b=>b.onclick=()=>{ boardMode=b.dataset.board; app.querySelectorAll('[data-board]').forEach(x=>x.setAttribute('aria-selected', x===b)); renderBoard(); });
  renderBoard();
  updateHeader();
}
async function renderBoard(){
  const el=$('#rows'); if(!el) return;
  const mode=boardMode;
  if(!db){
    el.innerHTML = `<li class="empty">Le classement partagé s'affiche quand la page est ouverte dans Claude par des membres de ton organisation. Ton record : <b>${mode==='xp'?P.xp+' XP':(P.best[mode]||0)}</b>.</li>`;
    return;
  }
  const rows = board.filter(r=>(r[mode]||0)>0).sort((a,b)=>(b[mode]||0)-(a[mode]||0)).slice(0,10);
  if(!rows.length){ el.innerHTML = `<li class="empty">Personne n'a encore de score ici. Lance une partie pour prendre la première place.</li>`; return; }
  let ps={}; try{ if(userCap) ps = await userCap.profiles(rows.map(r=>r.id)); }catch(e){}
  if(mode!==boardMode) return;
  el.innerHTML='';
  rows.forEach((r,i)=>{
    const p=ps[r.id]||{}; const li=document.createElement('li'); if(r.id===me) li.className='me';
    li.innerHTML = `<span class="rank ${i===0?'p1':''}">${i+1}</span>${p.avatarUrl?`<img alt="" src="${esc(p.avatarUrl)}">`:''}<span class="nm"></span><span class="sc">${r[mode]}${mode==='xp'?' XP':''}</span>`;
    li.querySelector('.nm').textContent = (p.name || 'Quelqu\'un') + (r.id===me?' (toi)':'');
    el.appendChild(li);
  });
}

/* ---------- Rendu : jeu ---------- */
function hudHtml(){
  let mid='';
  if(G.mode==='classique') mid=`<span class="pill">Question ${Math.min(G.idx,G.total)}/${G.total}</span>`;
  if(G.mode==='survie') mid=`<span class="pill"><span class="hearts" aria-label="${G.lives} vies">${'♥'.repeat(G.lives)}${'♡'.repeat(Math.max(0,MODES.survie.lives-G.lives))}</span></span><span class="pill">${G.correct} réussies</span>`;
  if(G.mode==='chrono') mid=`<span class="pill" id="chronoLeft">${Math.ceil(G.timeLeft)} s</span>`;
  return `<button class="quit" id="quit">✕ Quitter</button>
    <div class="hud__mid">${mid}<span class="pill" id="score">${G.score} pts</span></div>
    <span class="pill pill--streak ${G.streak?'':'cold'}" id="streak" title="Série de bonnes réponses">● ${G.streak} · ×${mult()}</span>`;
}
function updateHud(){
  const h=$('.hud'); if(!h) return;
  if(G.mode==='chrono'){ const c=$('#chronoLeft'); if(c) c.textContent=Math.ceil(G.timeLeft)+' s';
    const bar=$('.timer>i'); if(bar) bar.style.width=Math.min(100, G.timeLeft/MODES.chrono.total*100)+'%';
    const w=$('.timer'); if(w) w.classList.toggle('low', G.timeLeft<15); }
}
function renderGame(){
  const c=G.cur, q=c.src;
  const keys='ABCDEF';
  const prog = G.mode==='classique' ? `<div class="progress" aria-hidden="true">${Array.from({length:G.total},(_,i)=>`<i class="${i<G.log.length?(G.log[i].ok?'ok':'ko'):(i===G.log.length?'cur':'')}"></i>`).join('')}</div>` : '';
  app.innerHTML = `
  <section class="game">
    <div class="hud">${hudHtml()}</div>
    ${prog}
    <div class="timer" aria-hidden="true"><i style="width:${G.mode==='chrono'?Math.min(100,G.timeLeft/MODES.chrono.total*100):100}%"></i></div>
    <article class="card" id="qcard">
      <div class="q__head"><span class="eyebrow">${esc(q.theme)} · ${'★'.repeat(q.lvl)}${'☆'.repeat(3-q.lvl)}</span>${G.mode!=='chrono'?'<span class="eyebrow" id="qsec" style="color:var(--muted)">'+G.cfg.qTime+' s</span>':''}</div>
      <h2 class="q__text" id="qtext">${fmt(q.q)}</h2>
      <div class="choices" role="group" aria-labelledby="qtext">
        ${c.order.map((oi,i)=>`<button class="ch" data-i="${i}"><span class="ch__k">${keys[i]}</span><span class="ch__t">${fmt(q.choix[oi])}</span><span class="ch__m" aria-hidden="true"></span></button>`).join('')}
      </div>
      <div class="tools">
        <button class="joker" id="joker" ${G.joker?'':'disabled'}>50/50 ${G.joker?'(1 joker)':'utilisé'}</button>
        <span>Bonne réponse rapide = bonus · série de 3 = ×1,5</span>
      </div>
    </article>
    <div id="fb"></div>
  </section>`;
  $('#quit').onclick=()=>{ cancelAnimationFrame(timerRaf); view='home'; G=null; render(); };
  $('#joker').onclick=useJoker;
  app.querySelectorAll('.ch').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  const first=app.querySelector('.ch'); if(first && window.matchMedia('(pointer:fine)').matches) first.focus({preventScroll:true});
}
function renderFeedback(pos, ok, gained, secs){
  const c=G.cur, q=c.src;
  app.querySelectorAll('.ch').forEach(b=>{
    const i=+b.dataset.i; b.disabled=true;
    if(i===c.ans){ b.classList.add('ok'); b.querySelector('.ch__m').textContent='✓'; }
    else if(i===pos){ b.classList.add('ko'); b.querySelector('.ch__m').textContent='✗'; }
    else b.classList.add('dim');
  });
  const j=$('#joker'); if(j) j.disabled=true;
  $('.hud').innerHTML=hudHtml(); $('#quit').onclick=()=>{ view='home'; G=null; render(); };
  const st=$('#streak'); if(ok&&st){ st.classList.add('bump'); setTimeout(()=>st.classList.remove('bump'),220); }
  const card=$('#qcard');
  if(ok){ const p=document.createElement('span'); p.className='pop'; p.textContent='+'+gained+(mult()>1?'  ×'+mult():''); card.appendChild(p); }
  else card.classList.add('shake');
  updateHud();
  const timeout = pos<0;
  const last = isOver();
  $('#fb').innerHTML = `
    <div class="card fb" aria-live="polite">
      <div class="verdict ${ok?'ok':'ko'}">${ok?'✓ Bonne réponse':'✗ '+(timeout?'Temps écoulé':'Raté')} <small>${ok?'+'+gained+' pts · '+secs.toFixed(1)+' s':'La bonne réponse : '+esc(q.choix[q.ans])}</small></div>
      ${q.expl?`<div class="box box--def"><span class="box__l">Explication</span>${fmt(q.expl)}</div>`:''}
      ${q.trap?`<div class="box box--trap"><span class="box__l">Piège d'examen</span>${fmt(q.trap)}</div>`:''}
      <button class="next" id="next">${last?'Voir le résultat':'Question suivante'} <kbd>Entrée</kbd></button>
    </div>`;
  $('#next').onclick=()=>{ if(G.mode==='chrono'||G.mode==='classique'||G.mode==='survie') nextQuestion(); };
  $('#next').focus({preventScroll:true});
  $('#fb').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth', block:'nearest'});
}

/* ---------- Rendu : fin ---------- */
function renderEnd(){
  const r=G.result, acc=G.answered?Math.round(100*G.correct/G.answered):0;
  const avg=G.times.length?(G.times.reduce((a,b)=>a+b,0)/G.times.length):0;
  const L=lvlOf(P.xp), lo=lvlFloor(L), hi=lvlFloor(L+1), pct=Math.round(100*(P.xp-lo)/(hi-lo));
  const wrong=G.log.filter(l=>!l.ok);
  let rank='';
  if(db && board.length){ const others=board.filter(b=>b.id!==me).map(b=>b[G.mode]||0); const pos=1+others.filter(s=>s>P.best[G.mode]).length; rank=`Ton record te place <b>${pos}<sup>${pos===1?'er':'e'}</sup></b> sur ${others.length+1} au classement ${esc(MODES[G.mode].name)}.`; }
  app.innerHTML = `
  <section class="end">
    <div class="card end__score">
      <span class="eyebrow">${esc(MODES[G.mode].name)}${G.onlyIds?' · Mes erreurs':''} · partie terminée</span>
      <span class="big">${G.score}</span><span>points</span>
      ${r.record?`<span class="record">Nouveau record ! Ancien : ${r.prevBest}</span>`:`<span style="color:var(--muted);font-size:14px">Record : ${P.best[G.mode]}</span>`}
      ${rank?`<p style="font-size:14px">${rank}</p>`:''}
    </div>
    <div class="stats">
      <div class="stat"><b>${G.correct}/${G.answered}</b><span>bonnes réponses</span></div>
      <div class="stat"><b>${acc} %</b><span>précision</span></div>
      <div class="stat"><b>${G.bestStreak}</b><span>meilleure série</span></div>
      <div class="stat"><b>${avg.toFixed(1)} s</b><span>temps moyen</span></div>
    </div>
    <div class="card profile" style="border:0;padding:16px">
      <div class="lvl"><div class="lvl__badge">${L}</div><div><div class="lvl__name">+${r.xpGain} XP${r.levelUp?' · Niveau '+L+' atteint !':''}</div><div class="lvl__sub">${esc(lvlName(L))} · ${P.xp} XP · série de ${P.days} jour${P.days>1?'s':''}</div></div></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>
    ${G.newBadges.length?`<div><div class="sec" style="margin-top:0"><h2 class="sec__title">Badges débloqués</h2></div><div class="newbadges">${G.newBadges.map(id=>{const b=BADGES.find(x=>x.id===id);return `<div class="badge on"><span class="badge__ico">${b.ico}</span><div><b>${b.name}</b><span>${b.desc}</span></div></div>`}).join('')}</div></div>`:''}
    <div class="actions">
      <button class="btn btn--main" id="again">Rejouer</button>
      ${wrong.length?`<button class="btn" id="redo">Rejouer mes ${wrong.length} erreur${wrong.length>1?'s':''}</button>`:''}
      <button class="btn" id="home">Accueil</button>
    </div>
    ${wrong.length?`<div class="review"><div class="sec" style="margin:4px 0 0"><h2 class="sec__title">À revoir</h2></div>
      ${wrong.map(l=>`<details><summary>${fmt(l.src.q)}</summary>
        <p class="ans">Bonne réponse : <b>${fmt(l.src.choix[l.src.ans])}</b>${l.picked>=0?' · ta réponse : '+fmt(l.src.choix[l.picked]):' · pas de réponse'}</p>
        ${l.src.expl?`<div class="box box--def"><span class="box__l">Explication</span>${fmt(l.src.expl)}</div>`:''}
        ${l.src.trap?`<div class="box box--trap" style="margin-top:8px"><span class="box__l">Piège d'examen</span>${fmt(l.src.trap)}</div>`:''}
      </details>`).join('')}</div>`:''}
  </section>`;
  const ids=wrong.map(l=>l.src.id), mode=G.mode, only=G.onlyIds;
  $('#again').onclick=()=>newGame(mode, only);
  if($('#redo')) $('#redo').onclick=()=>newGame('classique', ids);
  $('#home').onclick=()=>{ view='home'; G=null; render(); };
  $('#again').focus({preventScroll:true});
  updateHeader();
  window.scrollTo(0,0);
}

function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const cv=document.createElement('canvas'); cv.className='confetti'; document.body.appendChild(cv);
  const ctx=cv.getContext('2d'), W=cv.width=innerWidth*devicePixelRatio, H=cv.height=innerHeight*devicePixelRatio;
  const cs=getComputedStyle(document.documentElement), cols=['--blue','--amber','--navy','--line'].map(v=>cs.getPropertyValue(v).trim());
  const parts=Array.from({length:120},()=>({x:W/2,y:H*0.35,vx:(Math.random()-.5)*W*0.025,vy:-Math.random()*H*0.02-H*0.005,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6}));
  let f=0; (function step(){ ctx.clearRect(0,0,W,H); parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=H*0.0006;p.a+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore();});
    if(++f<150) requestAnimationFrame(step); else cv.remove(); })();
}

/* ---------- Clavier ---------- */
document.addEventListener('keydown',e=>{
  if(view!=='game'||!G) return;
  if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if(!G.locked){
    const k=e.key.toUpperCase(); let i='1234'.indexOf(k); if(i<0) i='ABCD'.indexOf(k);
    if(i>=0 && i<G.cur.order.length && !G.cur.removed.includes(i)){ e.preventDefault(); answer(i); }
  } else if(e.key==='Enter'){ e.preventDefault(); nextQuestion(); }
});

$('#hdrModules').onclick=()=>{ cancelAnimationFrame(timerRaf); G=null; view='modules'; render(); window.scrollTo(0,0); };

/* ---------- Démarrage : liste les modules et rouvre le dernier utilisé ---------- */
render();
(async function init(){
  MODS = await listModules();
  const ok = MODS.filter(m=>m.bank);
  let last=null; try{ last=localStorage.getItem(MOD_LS); }catch(e){}
  const pick = ok.find(m=>m.file===last) || (ok.length===1 ? ok[0] : null);
  if(pick){ loadBank(pick.file, pick.bank); view='home'; }
  render();
})();
})();
